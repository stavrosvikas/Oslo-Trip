<header class="top">

<main>

  <!-- ═══ ΜΕΡΗ: χάρτης + λίστα, μαζί ═══ -->
  <section class="panel on" id="p-places">
    <div class="split" id="split">

      <div class="mapbox">
        <div id="map"></div>
        <div class="tools">
          <button class="tool add" id="bAdd" aria-label="Πρόσθεσε μέρος"><svg class="ic"><use href="#ic-plus"/></svg></button>
          <button class="tool" id="bMe" aria-label="Πού είμαι"><svg class="ic"><use href="#ic-crosshair"/></svg></button>
          <button class="tool" id="bOff" aria-label="Κατέβασε τον χάρτη"><svg class="ic"><use href="#ic-download"/></svg></button>
        </div>
        <button class="grow" id="bGrow" aria-label="Μεγάλωσε τον χάρτη"><svg class="ic"><use href="#ic-chevron-down"/></svg></button>
      </div>

      <div class="listbox">
        <div class="bar">
          <div class="fld">
            <svg class="ic"><use href="#ic-search"/></svg>
            <input type="search" id="q" placeholder="Βρες μέρος…" autocomplete="off">
          </div>
        </div>
        <div id="groups" class="groups"></div>
      </div>

    </div>
  </section>

  <!-- ═══ ΠΡΟΓΡΑΜΜΑ: ξεκινά άδειο ═══ -->
  <section class="panel" id="p-plan">
    <div class="days" id="days"></div>
    <div id="daybox" class="daybox"></div>
  </section>

</main>

<nav class="tabs" id="tabs">
  <button class="tab on" data-t="places"><svg class="ic"><use href="#ic-map"/></svg><i>Μέρη</i></button>
  <button class="tab" data-t="plan"><svg class="ic"><use href="#ic-calendar"/></svg><i>Πρόγραμμα</i></button>
</nav>
